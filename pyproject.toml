[project]
name = "bq-sync-kit"
version = "0.1.0"
description = "跨项目的 JSONL -> BigQuery 文件同步工具，状态集中存放在共享 MySQL"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.20",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[project.scripts]
bq-sync-kit = "bq_sync_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bq_sync_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
